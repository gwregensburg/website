{{- /* One book or publication from data/books/<id>.yaml: {{< book "<id>" >}} (id = file name without .yaml). */ -}}
{{- $id := .Get 0 | default (.Get "id") -}}
{{- with index hugo.Data.books $id -}}
  <div class="hx:mt-6 hx:mb-6">
    {{ partial "book" . }}
  </div>
{{- else -}}
  {{- warnf "book: unknown book %q in %s" $id $.Position -}}
{{- end -}}
