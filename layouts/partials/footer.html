{{- $footerWidth := "hx:max-w-screen-xl" -}}
{{- with .Site.Params.footer.width -}}
  {{ if eq . "wide" -}}
    {{ $footerWidth = "hx:max-w-[90rem]" -}}
  {{ else if eq . "full" -}}
    {{ $footerWidth = "max-w-full" -}}
  {{ end -}}
{{- end -}}


<footer class="hextra-footer hx:bg-gray-100 hx:pb-[env(safe-area-inset-bottom)] hx:dark:bg-neutral-900 hx:print:bg-transparent">
  <div
    class="{{ $footerWidth }} hx:mx-auto hx:flex hx:justify-center hx:py-4 hx:pl-[max(env(safe-area-inset-left),1.5rem)] hx:pr-[max(env(safe-area-inset-right),1.5rem)] hx:text-gray-600 hx:dark:text-gray-400 hx:md:justify-center"
  >
    <div class="hx:flex hx:w-full hx:flex-col hx:items-center hx:sm:items-center">
      <div class="hx:text-md"><a href="/impressum" >Impressum & Datenschutz</a></div>
    </div>
  </div>
</footer>
