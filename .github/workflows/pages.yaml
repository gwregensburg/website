# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Daily rebuild, so past events drop off the "upcoming events" lists.
  schedule:
    - cron: '0 3 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    # Pushes only deploy when the commit message contains "deploy" (Pages CMS commits always do).
    # Scheduled and manual runs always deploy.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'deploy')
    runs-on: ubuntu-latest
    env:
      # Same version locally and in CI; the Hextra theme needs at least 0.134.
      HUGO_VERSION: 0.167.0
    steps:        
      # - name: Install Dart Sass
      #   run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb  
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      # Resized images (partials/image.html) are cached between runs, so only new or changed images
      # are processed. Without the cache a build takes a few minutes, with it a few seconds.
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-images-${{ env.HUGO_VERSION }}-${{ hashFiles('static/images/**', 'hugo.yaml', 'layouts/partials/image.html') }}
          restore-keys: |
            hugo-images-${{ env.HUGO_VERSION }}-
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
