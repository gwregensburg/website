      - name: other_pages
        label: Weitere Seiten
        type: collection
        path: content
        format: yaml-frontmatter
        subfolders: false
        exclude: [_index.md]
        view:
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
