# Pages CMS (https://pagescms.org): web editor for the website content.
# Editors are invited by email in Pages CMS. Every save is a commit on main, which the
# GitHub Pages workflow publishes. Homepage and layout pages are deliberately not editable here.

media:
  input: static/images
  output: /images
  categories: [image]
  rename: safe

settings:
  content:
    # Keep front matter keys that aren't configured below instead of dropping them on save.
    merge: true
  commit:
    # Record the editor's name in the commit.
    identity: user
    # "deploy" in the message makes the Pages workflow publish the change.
    templates:
      create: "deploy: {path} angelegt (via Pages CMS)"
      update: "deploy: {path} geändert (via Pages CMS)"
      delete: "deploy: {path} gelöscht (via Pages CMS)"
      rename: "deploy: {oldPath} umbenannt in {newPath} (via Pages CMS)"

content:
  - name: events
    label: Veranstaltungen
    type: collection
    path: data/events
    format: yaml
    filename: "{fields.date}-{fields.title}.yaml"
    view:
      fields: [date, title, location]
      primary: title
      sort: [date, title]
      search: [title, location, organizer]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: end_date
        label: Bis
        description: Nur bei mehrtägigen Veranstaltungen
        type: date
        options: { format: yyyy-MM-dd }
      - name: time
        label: Uhrzeit
        description: z. B. 19 - 20:30 Uhr
        type: string
      - name: location
        label: Ort
        type: string
        required: true
      - name: organizer
        label: Veranstalter
        type: string
      - name: link
        label: Link für mehr Informationen
        type: string
      - name: description
        label: Beschreibung
        description: Markdown möglich, z. B. **fett** oder [Linktext](https://…)
        type: text
      - name: internal
        label: Eigene Vereinsveranstaltung
        description: Wird hervorgehoben und zusätzlich im Mitgliederbereich angezeigt.
        type: boolean
      - name: subtitle
        type: string
        hidden: true

  - name: news
    label: Aktuelles
    type: collection
    path: content/aktuelles
    format: yaml-frontmatter
    exclude: [_index.md]
    filename: "{primary}.md"
    view:
      fields: [image, title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: description
        label: Kurzbeschreibung
        description: Erscheint in der Übersicht und in Suchmaschinen.
        type: text
      - name: image
        label: Vorschaubild
        type: image
      - name: authors
        label: Autor:innen
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
      - name: tags
        label: Schlagwörter
        type: string
        list: true
      - name: toc
        label: Inhaltsverzeichnis anzeigen
        type: boolean
      - name: body
        label: Text
        description: Markdown. Bilder mit ![Beschreibung](/images/datei.jpg) einfügen.
        # Plain markdown editor on purpose: existing posts contain raw HTML and Hugo shortcodes,
        # which a WYSIWYG editor could rewrite.
        type: code
        options: { format: markdown }

  # Books, publications, podcasts and videos, one file each, all shown in book view.
  # Library books (📚) are listed by {{< books >}}, Infothek entries (📖) by {{< infothek >}};
  # any entry can be placed on a page with {{< book "<ID>" >}} (ID = file name without .yaml).
  - name: books
    label: Medien
    type: collection
    path: data/books
    format: yaml
    filename:
      template: "{fields.title}.yaml"
      # The file name is the ID used on pages. Editable when creating (to pick a short ID), shown locked
      # afterwards: renaming is off, because it would break every page using the ID.
      field: true
    operations: { rename: false }
    view:
      # Markers right after the title, so they stay visible when the text columns make the table wide.
      fields: [image, title, type, tipp, library, infothek, author]
      primary: title
      sort: [weight, title, type]
      search: [title, subtitle, author]
      default:
        sort: weight
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: type
        label: Art
        description: Leer lassen für Bücher und Publikationen.
        type: select
        options:
          placeholder: Buch / Publikation
          values: [Podcast, Video]
      - name: subtitle
        label: Untertitel
        type: string
      - name: author
        label: Autor:in / Herausgeber / Quelle
        description: Bei Podcasts und Videos der Sender oder die Sendung, z. B. "DLF Kultur" oder "holy HOME".
        type: string
      - name: published
        label: Erschienen
        description: z. B. April 2024
        type: string
      - name: image
        label: Cover
        type: image
      - name: link
        label: Link
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: topics
        label: Themen
        description: Für den Filter in der Infothek. Mehrere möglich.
        type: select
        options:
          multiple: true
          placeholder: Kein Thema
          values: [Genossenschaft, Mietshäusersyndikat, Baugemeinschaft, Wohnen im Alter, Mehrgenerationenwohnen, Cluster-Wohnen, Inklusion, Beispiele, Rechtsformen, Finanzierung]
      - name: tipp
        label: Buchtipp
        description: Wird auf der Webseite als Tipp hervorgehoben.
        # A select instead of a boolean, so the table shows ★ instead of "True".
        type: select
        options:
          multiple: true
          max: 1
          placeholder: Kein Tipp
          values:
            - name: "★"
              label: "★ Buchtipp"
      - name: library
        label: Vereinsbibliothek
        description: Ausleihbares Buch, erscheint auf der Bibliotheksseite. Andere Publikationen bindet man auf einer Seite mit {{< book "Dateiname" >}} ein.
        # A select instead of a boolean, so the table shows 📚 instead of "True".
        type: select
        options:
          multiple: true
          max: 1
          placeholder: Nicht in der Bibliothek
          values:
            - name: "📚"
              label: "📚 Vereinsbibliothek (ausleihbar)"
      - name: infothek
        label: Infothek
        description: Erscheint in der Infothek.
        # A select instead of a boolean, so the table shows 📖 instead of "True".
        type: select
        options:
          multiple: true
          max: 1
          placeholder: Nicht in der Infothek
          values:
            - name: "📖"
              label: "📖 In der Infothek zeigen"
      - name: weight
        label: Reihenfolge
        description: Kleinere Zahl = weiter oben in der Bibliothek bzw. Infothek (dort innerhalb der Art). Einträge ohne Zahl stehen ganz unten.
        type: number
      - name: tags
        label: Schlagwörter
        type: string
        list: true

  # One file per article. The file name (without .yaml) is the ID used on pages: {{< press "<ID>" >}}
  - name: press
    label: Presse
    type: collection
    path: data/press
    format: yaml
    filename:
      template: "{fields.date}-{fields.title}.yaml"
      # The file name is the ID used on pages. Editable when creating (to pick a short ID), shown locked
      # afterwards: renaming is off, because it would break every page using the ID.
      field: true
    operations: { rename: false }
    view:
      fields: [date, title, source, topics]
      primary: title
      sort: [date, title, source]
      search: [title, source, author, teaser]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: month_only
        label: Nur Monat anzeigen
        description: Wenn der genaue Tag unbekannt ist (z. B. "August 2024").
        type: boolean
      - name: source
        label: Medium
        description: z. B. Mittelbayerische, regensburg-digital
        type: string
        required: true
      - name: author
        label: Autor:in
        type: string
      - name: link
        label: Link zum Artikel
        type: string
      - name: link_label
        label: Linktext
        description: Leer lassen für "Artikel lesen". Z. B. "Beitrag anschauen" bei Videos.
        type: string
      - name: paywall
        label: Bezahlschranke
        description: Zeigt ein €-Symbol neben dem Link.
        type: boolean
      - name: teaser
        label: Teaser
        description: Kurzer Auszug aus dem Artikel.
        type: text
      - name: topics
        label: Erscheint auf
        description: Der Artikel wird automatisch im Abschnitt „Presse“ dieser Seiten angezeigt (neueste zuerst).
        type: select
        options:
          multiple: true
          values:
            # name = topic used on the page: {{< press topic="<name>" >}}
            - { name: plk, label: Prinz-Leopold-Kaserne (PLK) }
            - { name: kastanienhof, label: Kastanienhof (Projektgruppe 5) }
            - { name: keilberg, label: Keilberg / Hollerweg }
            - { name: wittelsbacher, label: Wittelsbacher Str. 7 }
            - { name: a4f, label: Architects for Future (A4F) }
            - { name: baukulturtage, label: 2. Baukulturtage }

  # All other pages, one collection per menu section (subfolders included, so new pages appear automatically).
  # Only title, description and text are in the form; other front matter (url, type, weight, cascade, ...)
  # is kept on save (settings.content.merge). No create/rename/delete: pages have fixed URLs and menu entries.
  # The home page (content/_index.md) is deliberately not editable here.
  - name: pages
    label: Seiten
    type: group
    items:
      - name: wohnprojekte
        label: Wohnprojekte
        type: collection
        path: content/wohnprojekte
        format: yaml-frontmatter
        subfolders: true
        view:
          layout: tree
          node: { filename: _index.md }
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: description
            label: Kurzbeschreibung
            description: Für Suchmaschinen und Vorschauen.
            type: text
          - name: body
            label: Text
            description: Markdown mit Hugo-Shortcodes ({{< … >}}) und HTML. Shortcodes und HTML-Blöcke bitte nur vorsichtig ändern.
            type: code
            options: { format: markdown }
      - name: mitmachen
        label: Mitmachen
        type: collection
        path: content/mitmachen
        format: yaml-frontmatter
        subfolders: true
        view:
          layout: tree
          node: { filename: _index.md }
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: description
            label: Kurzbeschreibung
            description: Für Suchmaschinen und Vorschauen.
            type: text
          - name: body
            label: Text
            description: Markdown mit Hugo-Shortcodes ({{< … >}}) und HTML. Shortcodes und HTML-Blöcke bitte nur vorsichtig ändern.
            type: code
            options: { format: markdown }
      - name: veranstaltungen
        label: Veranstaltungen
        type: collection
        path: content/veranstaltungen
        format: yaml-frontmatter
        subfolders: true
        view:
          layout: tree
          node: { filename: _index.md }
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: description
            label: Kurzbeschreibung
            description: Für Suchmaschinen und Vorschauen.
            type: text
          - name: body
            label: Text
            description: Markdown mit Hugo-Shortcodes ({{< … >}}) und HTML. Shortcodes und HTML-Blöcke bitte nur vorsichtig ändern.
            type: code
            options: { format: markdown }
      - name: wissen
        label: Wissen
        type: collection
        path: content/wissen
        format: yaml-frontmatter
        subfolders: true
        view:
          layout: tree
          node: { filename: _index.md }
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: description
            label: Kurzbeschreibung
            description: Für Suchmaschinen und Vorschauen.
            type: text
          - name: body
            label: Text
            description: Markdown mit Hugo-Shortcodes ({{< … >}}) und HTML. Shortcodes und HTML-Blöcke bitte nur vorsichtig ändern.
            type: code
            options: { format: markdown }
      - name: verein
        label: Verein
        type: collection
        path: content/verein
        format: yaml-frontmatter
        subfolders: true
        view:
          layout: tree
          node: { filename: _index.md }
          primary: title
        operations: { create: false, rename: false, delete: false }
        fields:
          - name: title
            label: Titel
            type: string
            required: true
          - name: description
            label: Kurzbeschreibung
            description: Für Suchmaschinen und Vorschauen.
            type: text
          - name: body
            label: Text
            description: Markdown mit Hugo-Shortcodes ({{< … >}}) und HTML. Shortcodes und HTML-Blöcke bitte nur vorsichtig ändern.
            type: code
