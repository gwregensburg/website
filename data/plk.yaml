q19:
  question: Um Verbindlichkeit zwischen den Projektmitgliedern zu schaffen wird meist
    ein Gesellschaftsvertrag aufgesetzt der mit einer Einlage einhergeht. In der Regel
    etwa 1000 € pro Mitglied. Dieses Geld wird für den Planungsprozess benötigt. Im
    besten Fall investierst Du damit in deine Wohnzukunft, im schlechtesten Fall bekommt
    das Projekt trotz intensiver Planung keinen Zuschlag bei der Vergabe und das Geld
    ist weg. Ist die Gruppe untätig, so bekommst du es am Ende wahrscheinlich einfach
    zurück. Kannst du Dir vorstellen, eine solche Einlage zu leisten?
  responses:
    Ja: 51
    Nein: 4
  type: pie
