- title: "Bauzentrum Stadtteilspaziergang Prinz-Eugen-Park: Gemeinschaftliches Wohnen im neuen Viertel"
  day: 26
  month: 05
  year: 25
  time: "18 - 19:30 Uhr"
  location: "München"
  link: https://veranstaltungen.muenchen.de/bauzentrum/veranstaltungen/bauzentrum-stadtteilspaziergang-prinz-eugen-park-gemeinschaftliches-wohnen-im-neuen-viertel-2/
  description: "Der Prinz-Eugen-Park war noch nicht bebaut, da planten die Bauherren (Genossenschaften, städtische und freie Wohnungsunternehmen sowie Baugemeinschaften) und künftige Bewohner*innen schon das Leben in diesem Neubaugebiet. Mit Bezug der ersten Häuser 2018 wurde die Quartiersgenossenschaft GeQo eG gegründet, als Netzwerkknoten für alle Aktivitäten in der Nachbarschaft, die im Quartiersrat und den Arbeitskreisen geplant werden. Das sind Bildungs-, Freizeit- und Gesundheitsangebote sowie Raummanagement, Mobilitätsstation und Verleihpool, die von der GeQo koordiniert werden. Das alles findet nicht nur in den zahlreichen Gemeinschaftsräumen statt, sondern auch in den großzügigen Parkanlagen, die das Viertel so lebenswert machen. Heike Skok von der Mitbauzentrale München führt entlang an den Gebäuden der Baugemeinschaften, Genossenschaften und städtischen Wohnungsunternehmen, die inzwischen alle mit Leben erfüllt sind."

