- title: "Offener Infoabend Hausprojekt Die Funke"
  day: 18
  month: 04
  year: 26
  time: "ab 19 Uhr"
  location: "M26 (Maximilianstraße 26)"
  organizer: "Die Funke"
  link: https://diefunke.org/
  description: "Die Funke ist ein selbstverwaltetes Wohnprojekt nahe des Regensburger Fernsehturms, das sich derzeit im Aufbau befindet. Ziel des Projekts sind bezahlbarer Wohnraum und Raum für Kultur. Beim Infoabend am 18.04. wird sich Die Funke als Hausprojekt vorstellen und über den aktuellen Stand informieren. Außerdem wird das Prinzip des Mietshäusersyndikats erklärt, und Interessierte können sich über Unterstützungsmöglichkeiten informieren. Wichtige Hürden haben wir schon geschafft: eine passende Immobilie finden, die Finanzierung und Sanierung planen, Förderanträge stellen und Kredite aufnehmen. Nach dem erfolgreichen Hauskauf steht nun die umfangreiche energetische Sanierung an', erklärt Lou, Mitglied der Planungsgruppe. Neben Einblicken in die nächsten Schritte wie bspw. die anstehende Sanierungsphase soll der Infoabend aber vor allem das langfristige Ziel vorstellen: selbstverwalteten günstigen Wohnraum und Raum für Kultur zu schaffen und der Mietenkrise ein Projekt entgegenzusetzen, das zeigt, wie es anders gehen könnte. Dabei ist der Anspruch des Hausprojekts größer, als dauerhaft bezahlbaren Wohnraum für ca. ein Dutzend Menschen zu schaffen. Die Funke versteht sich durchaus als Modell, das Nachahmer sucht. So soll über Informationen zum konkreten Projekt hinaus auch diskutiert werden, inwiefern das Konzept des Mietshäusersyndikats einen Beitrag zum Weg aus der Wohraumkrise leisten könnte. Interessierte sind herzlich eingeladen, sich zu informieren und mit uns ins Gespräch zu kommen. Für kalte und warme Getränke sowie Snacks ist gesorgt - natürlich alles auf Spendenbasis."

- title: "Vortrag: Baugruppe StadtNatur München — Heidi Rauch berichtet von ihren Erfahrungen"
  day: 25
  month: 04
  year: 26
  internal: true
  time: "16 - 18 Uhr"
  location: "Raum für Engagement (D.-Martin-Luther-Straße 19)"
  organizer: "Gemeinschaftlich Wohnen Regensburg e.V."
  description: Heidi Rauch, Autorin des Buchs [Mut zum Miteinander! Gemeinsam bauen, wohnen und leben](https://www.isbn.de/buch/9783982556628/mut-zum-miteinander) lebt in München in dem [Projekt StadtNatur](/wohnprojekte/beispiele/stadtnatur/), das von einer Baugemeinschaft gebaut wurde. In ihrem Vortrag berichtet sie von ihren Erfahrungen. <br> Insgesamt 35 Parteien mit Menschen von 0 bis 80 Jahren bilden die Baugemeinschaft StadtNatur am Stadtpark München-Riem. Sie wohnen seit Ende 2020 in einem Holz-Hybrid-Haus, das die ArchitekturWerkstatt Vallentin als inzwischen prämiiertes Passivhaus Plus gebaut hat. Die extrem niedrigen Energiekosten sind sowohl der ökologischen Bauweise als auch dem Engagement der eigenen Energie GbR zu verdanken. Die Eigentümer-Gemeinschaft hat viel Sinn für Kulinarik – vom Bewohner-Brunch übers Sommerfest und gemeinsamem Grillen bis zum Plätzchen-Backen und zur Nikolaus-Bescherung für die 28 Kinder. <br> Eintritt für Vereinsmitglieder frei, ansonsten 6 €.

