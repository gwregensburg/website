- title: "ABGESAGT: Mut zum Miteinander! Gemeinsam bauen, wohnen und leben"
  day: 28
  month: 6
  year: 24
  time: "19 - 21 Uhr"
  location: "Neutraubling, vhs im Klosterbau (Königsberger Str. 4, Zi. 1.7)"
  organizer: "vhs – Heidi Rauch"
  link: "https://www.vhs-regensburger-land.de/p/gesund-und-aktiv-647-C-241-110070"
  description: Wohnen wird in unseren Breitengraden immer teurer, gleichzeitig nimmt die Vereinsamung zu. Dass dies nicht sein muss, zeigt das neue Buch „Mut zum Miteinander! Gemeinsam bauen, wohnen und leben“ der Münchner Journalistin Heidi Rauch und des in Ravensburg wohnenden Historikers Dr. Wolfgang Eckart. Sie haben ein Dutzend Wohnprojekte in Deutschland, Österreich und in der Schweiz besucht und dort Interviews geführt. mit Gründer:innen, Architekt:innen, Projektleiter:innen und langjährigen Bewohner:innen gemeinschaftlicher Wohn-Initiativen. Heidi Rauch wird aus ihrem Buch lesen. Anschließend wollen wir gemeinsam ins Gespräch kommen. Dabei wird Heidi Rauch auch auf ihre persönlichen Erfahrungen zurückgreifen. Seit Ende 2020 lebt sie in einem ökologischen Mehrgenerationenhaus in München, das eine Baueigentümer-Gemeinschaft gebaut hat - unter Einhaltung des Fertigstellungstermins und der Baukosten.

