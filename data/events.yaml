- title: "„Weg damit – oder eine Zukunft für alte Gebäude!“"
  day: 8
  month: 11  
  year: 24
  time: "19 Uhr"
  location: "Degginger"
  organizer: "Architekturkreis"
  link: "https://www.architekturkreis.de/aktuelles/veranstaltung01-c3j35-8tcxj-a8n2f-dt5r3-eshd5"
  description: <i>Architekturvortrag von Birgit & Mathias Mahnke.</i> <br> Birgit und Mathias Mahnke sind Unternehmensberater und Immobilienentwickler. Ihr Kredo lautet aber nicht abreißen, sondern Umnutzen! Ganz im Sinne der Baukultur entwickeln sie  aus alten Gebäuden moderne und zeitgemäße Architektur mit neuer Nutzung. Ein Schwerpunkt für die neue Nutzung ist die Kreativwirtschaft aber auch Urlaubsarchitektur und Wohnen in alten Gemäuern. Geographischer Schwerpunkt ist der Osten Deutschlands, wo sie in der Fachwelt viel Aufmerksamkeit durch die Umnutzung alter und vom Abriss bedrohter Industriearchitektur erhalten haben.

- title: "Anders bauen, anders wohnen"
  day: 12
  month: 11  
  year: 24
  time: "18 Uhr"
  location: "Halle A, Fakultät für Architektur, OTH Regensburg"
  organizer: "Michael Kroll"
  description: <b>Herausforderungen und Chancen für Architekt:innen</b> <br> Gemeinschaftlich bauen und wohnen bietet einen Mehrwert sowohl für Bewohnende wie auch für Stadtteile und Quartiere. Partizipative Entwicklungs-, Planungs- und Bauprozesse haben ihre Besonderheiten. Für Architekt:innen ergeben sich daraus neue Ansätze für die nutzerorientierte Planung von Wohngebäuden. Der Vortrag beleuchtet diese, zeigt gemeinschaftliche Wohnprojekte in Beispielen, geht auf Organisationsformen und Konzeptvergabeverfahren ein und stellt die besondere Rolle von Architekt:innen heraus. <br><i> – Michael Kroll kennt die Herausforderungen und Chancen aus der Rolle des Projektentwicklers und -beraters sowie der Sicht des Vorstands einer Wohnungsgenossenschaft.</i>

