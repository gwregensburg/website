- title: "Bauzentrum Stadtteilspaziergang: Freiham – der neue Münchner Westen"
  day: 28
  month: 04
  year: 25
  time: "18 - 19:30 Uhr"
  location: "München"
  link: https://veranstaltungen.muenchen.de/bauzentrum/veranstaltungen/bauzentrum-stadtteilspaziergang-freiham-der-neue-muenchner-westen-2/
  description: "Nach dem Leitbild kompakt, grün, urban entsteht nördlich der Bodenseestraße in mehreren Abschnitten ein neuer Stadtteil mit einem Landschaftspark mit vielfältigen Erholungsangeboten. Die Bewohner:innen gestalten ihr Viertel aktiv mit. Bürger:innen, Unternehmer*innen und Vereine leisten ihren Beitrag um den Stadtteil mit Leben zu füllen. Das Stadtteilmanagement Freiham unterstützt und moderiert diesen Prozess. Dies ist der Schlüssel für eine nachhaltige Stadtentwicklung und eine lebenswerte Zukunft vor Ort. N.N. geht bei ihrem Rundgang auf folgende Fragestellungen ein: Wie verbinden sich die alten Wohngebiete wie das dörfliche Aubing mit dem neuen Gebiet? Welche Wohnformen sind entstanden und geplant? Entwickelt sich bereits urbanes Leben und entstehen lebendige Nachbarschaften? Welche Rolle spielen dabei auch Genossenschaften und städtische Baugesellschaften oder vielfältige gemeinschaftliche Raumangebote und Projekte?"

