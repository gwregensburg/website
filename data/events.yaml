  description: Beim Thema Inklusion denken viele zunächst nur an Barrierefreiheit. Damit inklusives Wohnen funktioniert, braucht es aber noch deutlich mehr als das. Beim Online MeetUp des Netzwerks Junge Ingenieure erfahrt ihr, auf was ihr bei inklusiven Bau-Projekten achten solltet. Wir haben drei Expertinnen und Experten eingeladen, die euch einen Überblick über aktuelle Konzepte und Vorgehensweisen geben

- title: "Gemeinschaftlich wohnen in Regensburg"
  subtitle: Beispiele aus der Praxis und Möglichkeiten der Förderung
