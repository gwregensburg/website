  year: 25
  location: "M26 (Maximiliansstraße 26)"
  description: "Mit der Ausstellung „RÄUME FÜR ALLE?!“ werden zu den 3. Regensburger Baukulturtagen Elemente der Ausstellung „Spaces of Solidarity“ der Forschungsgruppe „Transforming Solidarities“ nach Regensburg geholt. Die Ausstellung zeigt Berliner Projekte aus den Bereichen Wohnen, Arbeit und Gesundheit, die aufzeigen, welche solidarische Zukunft möglich ist. Denn ein solidarisches Miteinander im Kontext wachsender sozialer Ungleichheit und Fremdenfeindlichkeit ist wichtiger denn je."


- title: "Bauzentrum Stadtteilspaziergang: Das zukunftsweisende Mehrgenerationenhaus 'StadtNatur' in München-Riem"
  day: 07
  month: 04
  year: 25
  time: "18 - 19:30 Uhr"
  location: "München"
  link: https://veranstaltungen.muenchen.de/bauzentrum/veranstaltungen/bauzentrum-stadtteilspaziergang-das-zukunftsweisende-mehrgenerationenhaus-stadtnatur-in-muenchen-riem/
  description: "35 Parteien der Baueigentümergemeinschaft „StadtNatur“ haben auf einem Grundstück der Stadt München ein Passivhaus Plus in Holz-Hybridbauweise gebaut, das sie seit Ende 2020 bewohnen. Michael Konitzer – Geschäftsführer der StadtNatur GbR und Mitglied des Verwaltungsbeirats – berichtet bei seinem Rundgang über das Grundstück von den energetischen und ökologischen Aspekten der Baugemeinschaft mit eigener Photovoltaik-Anlage und Grundwasser-Wärmepumpe, dem platzsparenden Flächenverbrauch durch Gäste-Appartements und Gemeinschaftsraum und den Vorteilen des gemeinschaftlichen Wohnens. Ein spannender Einblick in eine zukunftsweisende Bau- und Wohnform."

