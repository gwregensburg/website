- title: "VHS-Vortrag: Gemeinschaftsorientiertes Wohnen in Wohnprojekten"
  day: 17
  month: 6
  year: 24
  time: "19 - 20:30 Uhr"
  location: "Volkshochschule Moosach, Baubergerstr. 6a"
  organizer: "Heike Skok - mitbauzentrale"
  link: "https://www.mitbauzentrale-muenchen.de/aktuelles/termine/termine-detail/vhs-vortrag-gemeinschaftsorientiertes-wohnen-in-wohnprojekten-9.html"
  description: Wohnen in Wohnprojekten wird immer beliebter – bei Familien, bei Menschen, die mit mehreren Generationen zusammenleben möchten und denjenigen, die nach der richtigen Wohnform für ihr eigenes Alter suchen. Es gibt Projekte für Miet-, Eigentums- oder Genossenschaftswohnungen. Sie erfahren bei dieser Veranstaltung, welche Projektformen es gibt, wie Projekte entstehen und funktionieren, und können dann abschätzen, ob diese Wohnform für Sie in Frage kommt.

- title: "Mietshäuser-Syndikats-Stammtisch"
  day: 19
  month: 6
  year: 24
  time: "19 - 22 Uhr"
  location: "M26 (Maximilianstraße 26)"
  organizer: "Mietshäuser-Syndikat"
  description: Der Mietshäuser-Syndikats-Stammtisch versteht sich als Regensburger Plattform für das Thema Mietshäuser Syndikate. Jeden dritten Mittwoch im Monat trifft sich das Mietshäuser-Syndikat, um über selbstverwalteten und bezahlbaren Wohnraum in Regensburg zu reden und Hausprojekte umzusetzen. Eingeladen sind alle, die Interesse an selbstverwaltetem Wohnraum haben – egal, ob ihr gerade erst von dieser Idee erfahren habt und einfach neugierig seid oder bereits Mitglied in einem Hausverein seid! Wir, als MHS-Stammtisch verstehen uns dabei als Plattform und Netzwerk für Aktivismus zum Thema Mietshäusersyndikat und selbstverwalteten Wohn- und Kulturraum. Wir wollen über Hausprojekte und Leerstand informieren und aufklären, darüber hinaus wollen wir auch als Ideenfabrik rund ums Thema bezahlbares Wohnen fungieren, um neue Konzepte zu entwickeln! Wir möchten das unerträgliche Missverhältnis zwischen dem knappen und teuren Wohnraum in Regensburg einerseits und hundertfachem Leerstand andererseits anprangern und aktiv werden, damit sich das ändert.

- title: "Tag der offenen Wohnprojekte 2024"
  day: 22
  month: 6
  year: 24
  time: "10 - 18 Uhr"
  location: "München"
  organizer: "mitbauzentrale München"
  link: "https://www.mitbauzentrale-muenchen.de/aktuelles/termine/termine-detail/tag-der-offenen-wohnprojekte-2024.html"
  description: 50 Münchner Projekte und Initiativen aus dem Umland – Genossenschaften, Syndikate, Baugemeinschaften und Vereine – öffnen ihre Türen und laden zu Besichtigungen, Diskussionsrunden und anderen Aktivitäten ein. Der Tag bietet Gelegenheit die Projekte hautnah zu erleben, mit Bewohnern ins Gespräch zu kommen und sich über unterschiedliche Wohnkonzepte zu informieren.

- title: "Tag der offenen Tür in der DANZ"
  day: 22
  month: 6
  year: 24
  time: "14 - 19 Uhr"
  location: "Danziger Freiheit 5"
  organizer: "Die Danz"
  link: "https://www.regensburg-digital.de/seit-zwoelf-jahren-mieter-und-vermieter-gleichzeitig-die-danz-in-regensburg/18062024/"
  description: Vor zwölf Jahren kauften die damaligen Bewohnerinnen der DANZ das Haus mit legendärer WG-Geschichte und nahmen es zusammen mit dem Mietshäusersyndikat dauerhaft vom Markt. Am kommenden Samstag stellt sich das Projekt wieder einmal der Öffentlichkeit vor.

- title: "GEM*EINSAM WOHNEN. Über Teilen, Nähe und Nachbarschaft."
  day: 24
  month: 6
  year: 24
  time: "17:30 - 20 Uhr"
  location: "Pinakothekenwiese an der Pinakothek der Moderne (Marianne-von-Werefkin-Weg), München"
  organizer: "TUM - Professur für Urban Design"
  link: "https://www.arc.ed.tum.de/ud/forschung/aktuelle-forschungsprojekte/gemeinsam-wohnen/"
  description: Im Rahmen der Diskussionsveranstaltung „GEM*EINSAM WOHNEN. Über Teilen, Nähe und Nachbarschaft“ diskutieren wir mit Expert:innen, Forscher:innen und beteiligten Akteur:innen über Transformationspotenziale „durch“ und „mit“ Gemeinschaft und stellen dabei Einfamilienhäuser und gemeinschaftliche Wohnformen ins Zentrum. Welche Potenziale stellen bestehende Siedlungen dar? Welche Dynamiken entwickeln sich in Nachbarschaften? Welche Akteur:innen stehen im Zentrum für zukünftige Transformationen im Kontext der Klimakrise? Die Veranstaltung besteht aus zwei aufeinander folgenden Diskussionen. Im ersten Panel steht das Einfamilienhaus und gemeinschaftliche Transformationen im Fokus, im zweiten Panel werden gemeinschaftliche Wohnformen und Nachbarschaften thematisiert. Im Anschluss finden die Vorstellung der Publikation „TOUCH.01 - Kollaboratives Wohnen“, die von der Professur für Urban Design herausgegeben wird, und ein Aperó statt.

- title: "Bauzentrum Stadtteilspaziergang Prinz-Eugen-Park: Gemeinschaftliches Wohnen im neuen Viertel"
  day: 24
  month: 6
  year: 24
  time: "18 - 19 Uhr"
  location: "Café GeQo, Maria-Nindl-Platz 6, 81927 München"
  organizer: "Bauzentrum München"
  link: "https://veranstaltungen.muenchen.de/bauzentrum/veranstaltungen/bauzentrum-stadtteilspaziergang-prinz-eugen-park-gemeinschaftliches-wohnen-im-neuen-viertel/"
  description: Der Prinz-Eugen-Park war noch nicht bebaut, da planten die Bauherren (Genossenschaften, städtische und freie Wohnungsunternehmen sowie Baugemeinschaften) und künftige Bewohner*innen schon das Leben in diesem Neubaugebiet. Mit Bezug der ersten Häuser 2018 wurde die Quartiersgenossenschaft GeQo eG gegründet, als Netzwerkknoten für alle Aktivitäten in der Nachbarschaft, die im Quartiersrat und den Arbeitskreisen geplant werden. Das sind Bildungs-, Freizeit- und Gesundheitsangebote sowie Raummanagement, Mobilitätsstation und Verleihpool, die von der GeQo koordiniert werden. Das alles findet nicht nur in den zahlreichen Gemeinschaftsräumen statt, sondern auch in den großzügigen Parkanlagen, die das Viertel so lebenswert machen. Heike Skok von der Mitbauzentrale München führt entlang an den Gebäuden der Baugemeinschaften, Genossenschaften und städtischen Wohnungsunternehmen, die inzwischen alle mit Leben erfüllt sind.

