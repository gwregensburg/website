title: Viele Versprechen für Prinz-Leopold-Kaserne
date: '2021-03-05'
source: regensburg-digital
link: https://www.regensburg-digital.de/viele-versprechen-fuer-prinz-leopold-kaserne/05032021/
teaser: Im Rahmen einer Informationsveranstaltung stellten Oberbürgermeisterin und Verwaltung diese Woche den derzeitigen Stand der Planungen auf dem ehemaligen Kasernenareal an der Landshuter Straße vor. Auch zu den angrenzenden Privatgrundstücken gibt es konkretere Informationen.
