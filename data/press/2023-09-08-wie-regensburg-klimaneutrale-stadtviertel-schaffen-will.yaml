title: Wie Regensburg klimaneutrale Stadtviertel schaffen will
date: '2023-09-08'
source: br
link: https://www.br.de/nachrichten/wirtschaft/wie-regensburg-klimaneutrale-stadtviertel-schaffen-will,TpB3i5X
link_label: Artikel lesen/hören
teaser: Städte und Gemeinden müssen eine Wärmeplanung vorlegen. So will es die Regierung im Begleitgesetz zum umstrittenen Heizungsgesetz. Regensburg hat zwei Modellprojekte, mit denen die Stadt auf dem Weg zu einer klimaneutralen Wärmeversorgung ist.
