title: „Bauwende jetzt“ gefordert – auch für das städtische Vorzeigeviertel
date: '2022-07-19'
source: regensburg-digital
link: https://www.regensburg-digital.de/bauwende-jetzt-gefordert-auch-fuer-das-staedtische-vorzeigeviertel/19072022/
teaser: Mehrere Bestandsgebäude auf der früheren Prinz-Leopold-Kaserne sollen erhalten werden statt sie abzureißen, lautet die Forderung einer Gruppe von Architektinnen und Architekten in einem Positionspapier. Im Stadtrat gibt es Unterstützung, aber eher so „grundsätzlich“.
