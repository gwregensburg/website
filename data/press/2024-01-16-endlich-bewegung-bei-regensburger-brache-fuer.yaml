teaser: Hinter den Kulissen wird schon länger an einer Wiederbelebung des ehemaligen Klostergebäudes in der Wittelsbacherstraße gearbeitet. Nach sechseinhalb Jahren Leerstand sind diese Bemühungen nun auch in aller Öffentlichkeit sichtbar.
