teaser: Auch in Regensburg fehlt bezahlbarer Wohnraum für eine wachsende Unter- und Mittelschicht, die sich Wohneigentum oder sogar die Miete in der Stadt nicht mehr leisten kann. Dies trifft besonders junge Familien und aufgrund des demografischen Wandels die wachsende Zahl älterer Paare oder alleinlebender Menschen...
