title: Bistum Regensburg sucht weiter Nutzer für seit sechs Jahren leerstehenden Gebäudekomplex
date: '2023-08-10'
source: CNA
link: https://de.catholicnewsagency.com/news/13794/bistum-regensburg-sucht-weiter-nutzer-fur-seit-sechs-jahren-leerstehenden-gebaudekomplex
teaser: Das Bistum Regensburg hat sich gegen den Vorwurf der Mittelbayerischen Zeitung verwahrt, wonach bester Wohnraum mitten in der Stadt vor sich hin rotte. Konkret stehe „ein großes Objekt in attraktiver Lage nun schon seit mehr als sechs Jahren leer“, berichtete die Zeitung am Montag.
