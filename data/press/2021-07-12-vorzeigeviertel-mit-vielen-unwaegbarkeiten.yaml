title: Vorzeigeviertel mit vielen Unwägbarkeiten
date: '2021-07-12'
source: regensburg-digital
link: https://www.regensburg-digital.de/vorzeigeviertel-mit-vielen-unwaegbarkeiten/12072021/
teaser: Die Planungen für die ehemalige Prinz-Leopold-Kaserne werden konkreter. Bis Ende 2024 müssen die ersten 368 Wohnungen stehen, damit die Stadt nicht Gefahr läuft, auf den günstigen Kaufpreis noch ein paar Millionen drauflegen zu müssen. Ein Großteil der positiv klingenden Planungen ist allerdings nach wie vor im Schwange.
