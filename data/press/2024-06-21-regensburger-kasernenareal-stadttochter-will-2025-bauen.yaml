title: 'Regensburger Kasernenareal: Stadttochter will 2025 bauen'
date: '2024-06-21'
source: Mittelbayerische
link: https://www.mittelbayerische.de/lokales/stadt-regensburg/regensburger-kasernenareal-stadttochter-will-2025-bauen-16286417
