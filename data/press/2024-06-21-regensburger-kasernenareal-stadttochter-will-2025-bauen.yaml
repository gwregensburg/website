teaser: Vor einem Jahr übergab die Stadt ihrer Bau-Tochter drei Grundstücke auf dem Areal der ehemaligen Prinz-Leopold-Kaserne. Gebaut hat sie dort noch nichts. Sie plant ihr Vorhaben mit 600 Wohnungen um.
