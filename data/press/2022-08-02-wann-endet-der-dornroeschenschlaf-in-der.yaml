title: Wann endet der Dornröschenschlaf in der Wittelsbacherstraße?
date: '2022-08-02'
source: Mittelbayerische
link: https://www.mittelbayerische.de/archiv/1/wann-endet-der-dornroeschenschlaf-in-der-wittelsbacherstrasse-11860043
paywall: true
teaser: 'Zentrale Lage am Altstadtrand, imposante Grundstücksgröße, die komplette Gebäuderückseite zum Park orientiert, keine Denkmalschutz-Auflagen: Von so etwas träumt man in der Immobilienbranche. Meist vergeblich, weil es so etwas in Regensburg eigentlich nicht gibt. Umso verwunderlicher ist es, wenn ein Objekt mit exakt diesem Zuschnitt seit mehr als fünf Jahren leer steht.'
topics:
- wittelsbacher
