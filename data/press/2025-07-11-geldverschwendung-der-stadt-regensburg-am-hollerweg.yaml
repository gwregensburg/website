title: 'Geldverschwendung der Stadt Regensburg am Hollerweg: Fläche besichtigt, aber Biotop nicht erkannt'
date: '2025-07-11'
source: regensburg-digital
link: https://www.regensburg-digital.de/geldverschwendung-der-stadt-regensburg-am-hollerweg-flaeche-besichtigt-aber-biotop-nicht-erkannt/11072025/
teaser: 'Nach Veröffentlichung unseres letzten Berichts zu dem überteuerten Grundstücksankauf am für den Bebauungsplan Hollerweg und mehrfacher Nachfragen, erklärt die Stadt Regensburg nun: Man hat die Fläche im Vorfeld doch in Augenschein genommen. Doch so ein Biotop sei nur schwer zu erkennen.'
