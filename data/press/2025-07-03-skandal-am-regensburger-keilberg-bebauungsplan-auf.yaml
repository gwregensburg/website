title: '„Skandal“ am Regensburger Keilberg: Bebauungsplan auf der Kippe und Millionen verschleudert?'
date: '2025-07-03'
source: regensburg-digital
link: https://www.regensburg-digital.de/skandal-am-regensburger-keilberg-bebauungsplan-auf-der-kippe-und-millionen-verschleudert/03072025/
teaser: 'Eine unbedachte Frage in der öffentlichen Sitzung des Stadtrats brachte es an den Tag: Die Stadt Regensburg hat bei dem ambitionierten Baugebiet am Keilberg ein Riesenproblem und vermutlich Flächen zu einem völlig überteuerten Preis angekauft.'
