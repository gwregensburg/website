title: 'Biotop statt Baugebiet: Stadt Regensburg prüfte Millionendeal offenbar nur vom Schreibtisch aus'
date: '2025-07-09'
source: regensburg-digital
link: https://www.regensburg-digital.de/biotop-statt-baugebiet-stadt-regensburg-pruefte-millionendeal-vom-schreibtisch-aus/09072025/
teaser: Der millionenteure Ankauf eines Grundstücks, dass nicht für die beabsichtige Bebauung geeignet ist, zieht weitere Kreise. Grüne und CSU fordern Aufklärung, wie es dazu kommen konnte. Offenbar hatte sich niemand bei der Stadt Regensburg die Fläche im Vorfeld vor Ort angesehen.
