title: 'Hier wird Nachbarschaft neu gedacht: In Regensburg entsteht ein alternatives Wohnprojekt'
date: '2026-09-15'
source: Mittelbayerische
link: https://www.mittelbayerische.de/lokales/stadt-regensburg/wohnprojekt-in-regensburg-der-kastanienhof-weckt-viele-hoffnungen-21982958
link_label: Beitrag lesen
paywall: true
teaser: Auf dem Gelände der ehemaligen Prinz-Leopold-Kaserne (PLK) in Regensburg wird ein neuer Wohnkomplex gebaut. Was in einem Teil des „Kastanienhofs“ entsteht, soll mehr sein als eine gewöhnliche Nachbarschaft. Den Interessenten schwebt ein gemeinschaftliches Wohnprojekt vor – mit Dachterrasse, Gemeinschaftsraum, Veranstaltungen und Workshops. Wie das genau aussehen soll, verhandeln sie derzeit mit der Bauherrin Stadtbau.
