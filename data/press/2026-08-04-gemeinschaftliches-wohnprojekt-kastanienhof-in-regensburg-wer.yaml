title: Gemeinschaftliches Wohnprojekt „Kastanienhof“ in Regensburg – Wer ist dabei?
date: '2026-08-04'
source: Mittelbayerische
link: https://www.mittelbayerische.de/lokales/stadt-regensburg/gemeinschaftlich-wohnen-in-regensburg-wer-ist-dabei-21711791
link_label: Beitrag lesen
paywall: true
teaser: 'Die Stadtbau und eine Gruppe von Regensburgern verwirklichen zusammen den Kastanienhof auf dem Gelände der früheren Prinz-Leopold-Kaserne. 46 Wohnungen entstehen in dem Projekt. Das Besondere: bezahlbare Mieten, enger Zusammenhalt und gegenseitige Unterstützung.'
