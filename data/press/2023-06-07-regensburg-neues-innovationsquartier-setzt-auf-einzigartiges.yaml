title: 'Regensburg: Neues Innovationsquartier setzt auf einzigartiges Energiekonzept'
date: '2023-06-07'
source: TVA
link: https://www.tvaktuell.com/mediathek/video/regensburg-neues-innovationsquartier-setzt-auf-einzigartiges-energiekonzept-2/
link_label: Beitrag anschauen
teaser: 'Seit Ende 2021 ist es gefühlt Dauerthema: Die Strom- und Gaspreise steigen in die Höhe, an den Tankstellen stehen immer wieder neue Höchstpreise und beim Blick auf die Energierechnung werden die Augen groß. Für das neue Areal auf dem Gelände der ehemaligen Prinz Leopold Kaserne will die Stadt Regensburg deshalb auf solarbasierte und CO2-neutrale Energie setzten.'
