teaser: 'Zusammen ist es schöner: Viele Regensburger können sich vorstellen, gemeinschaftlich zu wohnen. Das bietet der Kastanienhof im Stadtosten, den die Stadtbau errichtet. Ein Verein engagierter Bürger redet ein gewichtiges Wort mit.'
