title: 'Wasserstoff-Förderung fürs Innovationsquartier: Stadt Regensburg blitzt beim Freistaat ab'
date: '2024-01-16'
source: regensburg-digital
link: https://www.regensburg-digital.de/t/prinz-leopold-kaserne/
teaser: Bei der Förderung des Energiekonzepts mit Wasserstofftechnologie auf der Prinz-Leopold-Kaserne lässt der Freistaat die Stadt Regensburg im ersten Anlauf hängen. Die hatte sich rund zwei Millionen Euro erhofft. So ging es den meisten Antragsstellern.
