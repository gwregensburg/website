title: Hunderte bezahlbare Wohnungen in Regensburg in der Warteschleife
date: '2023-10-19'
source: Mittelbayerische
link: https://www.mittelbayerische.de/lokales/stadt-regensburg/hunderte-bezahlbare-wohnungen-in-regensburg-in-der-warteschleife-14610015
paywall: true
teaser: Auf dem Areal der ehemaligen Prinz-Leopold-Kaserne sollte ein klimafreundliches Vorzeigeviertel mit günstigen Wohnungen entstehen. Jetzt liegt es brach. Kommt der Bau von günstigem Wohnraum in Regensburg insgesamt zum Erliegen?
