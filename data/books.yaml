- title: Mut zum Miteinander!
  subtitle: Gemeinsam bauen, wohnen und leben
  image: /images/mut-zum-miteinander.webp
  author: Heidi Rauch ⸱ Dr. Wolfgang Eckert
  published: April 2024
  link: https://www.isbn.de/buch/9783982556628/mut-zum-miteinander
  tags: [Projekt]
  description: Ein Mutmach-Ratgeber zu einem hochaktuellen Thema! Wohnen wird in unseren Breitengraden immer teurer, gleichzeitig nimmt die Vereinsamung zu. Dass dies nicht sein muss, zeigt dieser Mutmach-Ratgeber.

- title: Wohnvielfalt
  subtitle: Gemeinschaftlich wohnen - im Quartier vernetzt und sozial orientiert
  image: /images/wohnvielfalt.png
  author: Wüstenrot Stiftung (Hrsg.)
  published: 2017
  link: https://wuestenrot-stiftung.de/publikationen/wohnvielfalt-gemeinschaftlich-wohnen-im-quartier-vernetzt-und-sozial-orientiert-download/
  tags: [Projekt]
  description: In den europäischen Städten entstehen zurzeit gemeinschaftliche Wohnprojekte, die eine enorme Kraft und Lebendigkeit entfalten. Noch vor wenigen Jahren sahen Kritiker in den neuen Wohnprojekten nur periphere Inseln für gemeinschaftssehnsüchtige Nostalgiker. Inzwischen finden gemeinschaftliche Wohn- und Lebensprojekte eine breite Anerkennung. Besonders Genossenschaften, aber auch private Baugemeinschaften haben sich als neue Akteure auf einem angespannten Wohnungsmarkt etabliert und werden von Städten und Gemeinden unterstützt. <br>Das Forschungsprojekt der Wüstenrot Stiftung beginnt mit der Analyse von zwölf gemeinschaftlichen Wohnprojekten. Durch eine systematische Gegenüberstellung werden in den Kapiteln Stadt, Raum, Programm und Organisation allgemeingültige Thesen abgeleitet.
  tipp: true

- title: Bezahlbar.Gut.Wohnen.
  subtitle: Strategien für erschwinglichen Wohnraum
  image: /images/bezahlbar_gut_wohnen.jpg
  author: Klaus Dömer ⸱ Hans Drexler ⸱ Joachim Schultz-Granberg
  published: 2017
  link: https://www.jovis.de/en/book/9783868594324
  tags: [Projekt]
  description: Wohnen ist ein Grundbedürfnis, das immer noch für viele Menschen in allen Regionen der Welt nicht oder nur unzureichend gedeckt wird. Architektur und Städtebau können einen entscheidenden Beitrag leisten, neue Lösungsansätze zu finden, um das Angebot von Wohnraum für alle sicherzustellen. Die Herausforderung für erschwingliches Wohnen besteht vor allem darin, die Kosten und den resultierenden Wohnwert in ein optimales Verhältnis zu setzen. Vor diesem Hintergrund werden in dem Buch nicht nur theoretische Ansätze vorgestellt, sondern am Beispiel herausragender Wohngebäude auch Strategien zur Schaffung von erschwinglichem Wohnraum aufgezeigt.
  tipp: true

- title: Wohnoptionen
  subtitle: gemeinschaftsorientiert ⸱ produktiv ⸱ adaptiv
  image: /images/wohnoptionen.png
  author: Wüstenrot Stiftung (Hrsg.)
  published: 2022
  link: https://wuestenrot-stiftung.de/publikationen/wohnoptionen-gemeinschaftsorientiert-produktiv-adaptiv-download/
  tags: [Projekt]
  description: Im Fokus der Studie stehen das gemeinschaftsorientierte, das produktive und das adaptive Wohnen. Damit werden drei wesentliche Trends eines neuen sozialen Raumgefüges aufgegriffen, die auf die Bedarfe nach mehr Gemeinschaft, einer klugen Verbindung von Wohnen und Arbeiten sowie Flexibilität und Anpassbarkeit des Wohnraumes reagieren.<br>Das Forschungsprojekt der Wüstenrot Stiftung umfasste eine empirische Untersuchung anhand von zwölf impulsgebenden Projekten, die in eine Erörterung des Paradigmenwechsels zu den Funktionen des Wohnens eingebettet werden. 

- title: Leitfaden für Gruppenwohnprojekte
  image: /images/leitfaden_gruppenwohnprojekte.jpg
  author: Astrid Holz ⸱ Rüdiger Muus ⸱ Dietmar Walberg
  published: 2015
  tags: [Projekt]
  link: https://arge-ev.de/arge-ev/publikationen/sonderveroeffentlichungen/
  description: Bauen und Leben in der Gemeinschaft stellt für immer mehr Menschen eine erstrebenswerte Art des Zusammenlebens dar. Gesellschaftliche Strukturen werden komplizierter, die Arbeitswelt organisiert sich komplexer in solchen Zeiten kann die Gruppe und das gemeinschaftliche Bauprojekt eine persönliche Sicherheit im Lebensumfeld darstellen. Der Leitfaden richtet sich an alle Menschen, die Interesse an dieser Art des Wohnens, des Bauens und des Realisierens von Projekten haben.
  tipp: true

- title: Das Erbbaurecht
  image: /images/trias_erbbaurecht.jpg
  author: Stiftung trias (Hrsg.)
  published: 2015
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/das-erbbaurecht/
  description: Mit dieser Broschüre will die Stiftun trias die vielfältigen Möglichkeiten des von ihr alltäglich bespielten Instrumentes Erbbaurecht aufzeigen. Dabei gibt sie sowohl einen Überblick über die Möglichkeiten des Einsatzes und der Gestaltung, als auch die hieraus entstehenden Mehrwerte, sowie Rechte und Pflichten für Erbbaurechtsnehmer und Erbbaurechtsgeber.

- title: Rechtsformen für Wohnprojekte
  image: /images/trias_rechtsformen.jpg
  author: Stiftung trias (Hrsg.)
  published: 2024
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/rechtsformen-fuer-wohnprojekte/
  description: Für die Realisierung von Wohnprojekten können grundsätzlich sehr unterschiedliche Rechtsformen in Betracht kommen. Diese Broschüre hilft, sich mit den unterschiedlichen Rechtsformen vertraut zu machen und sich ein Bild von den jeweiligen Chancen und Risiken zu verschaffen.

- title: Die Genossenschaft als Rechtsform für Wohnprojekte
  image: /images/trias_genossenschaft.png
  author: Stiftung trias (Hrsg.)
  published: 2019
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/die-genossenschaft-als-rechtsform-fuer-wohnprojekte/
  description: Was sind die Vor- und Nachteile der eingetragenen Genossenschaft (eG) als Rechtsform für gemeinschaftliche Wohnprojekte? Was unterscheidet sie von anderen möglichen Rechtsformen? Wie geht das mit der Gründung einer Genossenschaft? <br>Darauf will die Broschüre Antworten und damit einen Überblick zur Orientierung für Projektinitiativen, interessierte Mitglieder, Berater und Unterstützer geben.

- title: Nachbarschaften sind »Machbar«schaften
  subtitle: Ideen und Beispiele für nachbarschaftliche Netzwerke
  image: /images/trias_nachbarschaften.jpg
  author: Stiftung trias (Hrsg.)
  published: 2013
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/nachbarschaften-sind-machbarschaften/
  description: Noch vor kurzem schienen nachbarschaftliche Netze in unseren Breiten überflüssig geworden zu sein. Heute erleben sie eine Art Renaissance, genauso wie die Bereitschafdt, sich unter bestimmten Bedingungen bürgerschaftlich zu engagieren. Mit dieser Broschüre will die Stiftung trias Nachbarn und denen, die es gerne werden wollen, Handwerkszeug geben, um Neue Nachbarschaften herzustellen oder wiederzubeleben.

- title: Der Gemeinschaftsraum in Wohnprojekten
  subtitle: Erfahrungen zu Konzeption, Planung und Betrieb
  image: /images/trias_gemeinschaftsraum.png
  author: Stiftung trias (Hrsg.)
  published: 2021
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/der-gemeinschaftsraum-in-wohnprojekten/
  description: Menschen sind verschieden, und so auch die Wohnprojekte, in denen sie sich gemeinschaftlich organisieren. Entsprechend unterschiedlich zeigen sich Gestaltung und Nutzungen ihrer Gemeinschaftsräume und folglich gibt es auch keinen allgemeingültigen Lösungsansatz zu deren Konzeption, Planung und Betrieb. Die Autor*innen, Helene Rettenbach und Mathias Sommer, haben für diese Broschüre 48 Wohnprojekte besucht und ihre Erfahrungen zu den Gemeinschaftsräumen festgehalten, um dazu beizutragen, dass Gemeinschaft in Wohnprojekten gelingt.

- title: Wohnprojekte und Wohnpflegegemeinschaften
  image: /images/wohnprojekte_und_pflegegemeinschaften.jpg
  author: Stiftung trias (Hrsg.)
  published: 2018
  tags: [Projekt]
  link: https://www.stiftung-trias.de/wissen/publikationen/wohnprojekte-und-wohnpflegegemeinschaften/
  description: Die zentrale Idee gemeinschaftlicher und nachbarschaftlicher Wohnprojekte ist der Wunsch nach einer lebendigen Gemeinschaft, in der Solidarität und Selbstbestimmung gelebt werden. Wohnpfegegemeinschaften können ein Maximum an Selbstbestimmung und Teilhabe trotz Hilfe­ und Unterstützungsbedarf ermöglichen. Damit entsprechen sie der Grundidee der meisten Wohnprojekte und können diese wunderbar ergänzen und erweitern. Damit die Realität aber den Ansprüchen gerecht wird, bedarf es einer guten und umsichtigen Planung.

- title: Zusammenhalt braucht Räume
  subtitle: Wohnen integriert
  image: /images/zusammenhalt_buch.jpg
  author: Christine Hannemann (Hrsg.) ⸱ Karin Hauser (Hrsg.) ⸱ Bettina Reimann ⸱ Julia Diringer ⸱ Gudrun Kirchhoff ⸱ Ricarda Pätzold ⸱ u.a.
  published: 2020
  tags: [Projekt]
  link: https://difu.de/publikationen/2020/zusammenhalt-braucht-raeume
  description: Die Rückkehr der Wohnungsfrage, die sich von den Problemen der Wohnkosten, der Zuwanderung und der Segregation herleitet, ist in der breiten Öffentlichkeit auf große Resonanz gestoßen. Das Wie des Wohnens hat erneut Aufmerksamkeit erlangt. Kleinbürgerliches Wohnen in einer abgeschlossenen Einheit, wie es sich in den 1920er Jahren etabliert hat, dominiert zwar bis heute, ist aber längst überholt. Dieses Konzept — Wohn-, Schlaf- und Kinderzimmer sowie Küche, Bad und Flur — steht einem Wohnen entgegen, das gesellschaftliche Integration, Teilhabe und Zusammenhalt fördert. Eine besondere Chance in dieser Hinsicht eröffnen Projekte, die interkulturelles, moderiertes und gemeinschaftliches Zusammenwohnen von verschiedenen sozialen Gruppen und Personen unterschiedlicher geografischer Herkunft ermöglichen - integrative Wohnprojekte. Die Autor*innen dieses Bandes haben einige davon ausfindig gemacht und in Fallstudien untersucht. "Zusammenhalt braucht Räume" fokussiert das Zusammenwohnen von Ortsansässigen und Neuzugewanderten.

- title: auf.einander.bauen
  subtitle: Baugruppen in der Stadt
  image: /images/auf_einander_bauen.jpg
  author: Kristien Ring (Hrsg.)
  published: 2007
  tags: [Projekt]
  description: Große, bezahlbare und individuell gestaltbare Wohnungen in den Innenstädten sind gefragt - die einheitlichen Standards der Großinvestoren und Bauträger können diese Wünsche jedoch nur bedingt erfüllen. Der Band "auf.einander.bauen" präsentiert nun eine Möglichkeit, den Traum vom Eigenheim selbst zu realisieren. Indem sich private Bauherren zu Baugruppen zusammenschließen, können sie ihren Entwurf ganz auf die eigenen Bedürfnisse ausrichten und sich die anfallenden Kosten teilen. Dass dadurch auch architektonisch anspruchsvolle, innovative, ja, zum Teil sogar Aufsehen erregende Architektur entsteht, belegen die hier vorgestellten zwölf Berliner Baugruppenprojekte.

- title: Bauen in der Gruppe
  subtitle: Kostengünstig, innovativ, ökologisch
  image: /images/bauen_in_der_gruppe.jpg
  author: Dörthe Fuchs ⸱ Jutta Orth
  published: 2000
  tags: [Projekt]
  description: Ein Bauvorhaben gemeinsam zu realisieren ist kostengünstiger als das übliche Architektenhaus und individueller als die Immobilie vom Bauträger. Die Ergebnisse - das beweisen die in diesem Buch in Wort und Bild vorgestellten Projekte - sind nicht nur architektonisch, sondern auch ökologisch überzeugend. Mit unserem Buch möchten wir zeigen, wie sich bei der Planung und Organisation gemeinschaftlicher Bauprojekte Fehler vermeiden, Probleme meistern und Chancen nutzen lassen. Den Planungs- und Bauprozess begleitend, gehen wir auf alle organisatorischen Fragen und gruppendynamischen Prozesse ein. Ein Serviceteil mit Musterverträgen, aktuellen Adressen und ausgewählter Literatur vervollständigt das Buch.

- title: Eigen- und Fremdkapitalbeschaffung für Genossenschaften
  subtitle: Problematik und Lösungen
  image: /images/herzberg_genossenschaften.jpeg
  author: Anja Herzberg
  published: 2012
  tags: [Projekt]
  link: https://my.akademikerverlag.de/catalogue/details/de/978-3-639-39103-9/eigen-und-fremdkapitalbeschaffung-fuer-genossenschaften
  description: Inhaltlich unveränderte Neuauflage. Die Rechtsform der Genossenschaft leidet an einem struktur­ellen Nachteil, nicht nur bei der Eigen- und Fremdkapitalbeschaffung son­dern obendrein bei der Eigenkapitalerhaltung. Zur Behebung der rechtsform­immanenten Kapitalschwäche werden mehrere Lösungen sowohl de lege lata als auch de lege ferenda vorgestellt. Darüber hinaus wird als alternative Rechtsform die Europäische Genossen­schaft auf ihre Kapitalbeschaffungsmöglichkeiten unter­sucht. Das Buch richtet sich an alle Interessenten des umfassenden Fachgebietes.

- title: Die freie Bauherrengemeinschaft
  subtitle: Praktische Überlegungen aus juristischer Sicht und Vertragsmuster
  image: /images/freie_bauherrengemeinschaft.jpg
  author: Friedrich Heinzmann
  published: 2015
  tags: [Projekt]
  link: https://wasmuth-verlag.de/shop/architektur-stadtplanung/architekturtheorie-und-lehre/die-freie-bauherrengemeinschaft/
  description: In diesem Buch erläutert Dr. Friedrich Heinzmann die rechtlichen Grundlagen des gemeinsamen Bauens und legt Vertragsmuster vor, an denen sich potentielle Baugemeinschaften orientieren können. Darüber hinaus geht der Autor auch auf die praktischen und psychologischen Fragen ein, mit denen sich Baugemeinschaften auseinandersetzen müssen. Im Vordergrund steht dabei insbesondere das Verhältnis zwischen Planungssicherheit der Gemeinschaft einerseits und individueller Flexibilität andererseits.