title: 'VHS-Vortrag: Gemeinschaftsorientiertes Wohnen in Wohnprojekten'
date: '2024-06-17'
time: 19 - 20:30 Uhr
location: Volkshochschule Moosach, Baubergerstr. 6a
organizer: Heike Skok - mitbauzentrale
link: https://www.mitbauzentrale-muenchen.de/aktuelles/termine/termine-detail/vhs-vortrag-gemeinschaftsorientiertes-wohnen-in-wohnprojekten-9.html
description: Wohnen in Wohnprojekten wird immer beliebter – bei Familien, bei Menschen, die mit mehreren Generationen zusammenleben möchten und denjenigen, die nach der richtigen Wohnform für ihr eigenes Alter suchen. Es gibt Projekte für Miet-, Eigentums- oder Genossenschaftswohnungen. Sie erfahren bei dieser Veranstaltung, welche Projektformen es gibt, wie Projekte entstehen und funktionieren, und können dann abschätzen, ob diese Wohnform für Sie in Frage kommt.
