title: '2. BAUKULTURTAGE: Wohnen in Regensburg'
date: '2024-10-08'
end_date: '2024-10-11'
time: 16 - 21 Uhr
location: M26 (Maximilianstraße 26)
organizer: M26 / bauwärts / Architekturkreis Regensburg / A4F / Gemeinschaftlich Wohnen Regensburg e.V.
link: /baukulturtage-2
description: Die 2. Baukulturtage sind eine dicht gepackte und hochkarätig besetzte Veranstaltung mit dem Fokus auf <b>gemeinschaftlichen Wohnformen</b>. Zu Gast auf dem Podium sind unter anderem <b>Natalie Schaller</b> von der <b>Mitbauzentrale München</b>, die seit 10 Jahren als städtische Stelle gemeinschaftliche Projekte in München beraten und vernetzen, <b>Prof. Boucsein</b> von der <b>TUM München</b> und <b>Konstantin Bauch</b> vom afa & Institut für Sozialplanung München.<br>Weiterhin stellt die Leiterin des Stadtplanungsamts, <b>Tanja Flemmig</b>, das <b>Neubaugebiet Keilberg</b> vor, <b>Tobias Ruf</b> berichtet als Projektleiter vom aktuellen Stand in dem <b>Innovationsquartier der ehem. Prinz-Leopold-Kaserne</b>.<br>Zwei Podiumsdiskussionen mit <b>Annette Fischer</b>, <b>Vorständin der Genossensschaft Wohnen Inklusiv Regensburg</b>, <b>Michael Kroll</b>, <b>ehem. Vorstand der Nabau eG, Vorstand der RaumFair eG und Inhaber des Beratungsbüros contemplan</b> sowie mit der Gruppe <b>Wohnen im Aureliaweg</b> in Burgweinting geben Einblicke in die Themen <b>Genossenschaft</b> und <b>Baugemeinschaft</b> und stellen erfolgreiche Projekte aus Regensburg vor.<br>Abgerundet wird die Veranstaltung durch einen <b>Film</b> über die Planungs- und Bauphase des genossenschaftlichen Projekts <b>wagnis 4</b> in München.<br>Der Eintritt an allen Tagen ist frei.
internal: true
