title: 'Workshop: Genossenschaft gründen'
date: '2025-07-18'
end_date: '2025-07-19'
location: Stuttgart
organizer: Stiftung trias
link: https://www.stiftung-trias.de/fileadmin/media/downloads/Flyer_Workshop_Stuttgart__2_.pdf
description: Gründungsworkshop neue Wohnungsbaugenossenschaften der innova eG, der Stiftung trias und der 'Dachgenossenschaft pro... gemeinam bauen und leben eG'.<br> Praktisches Wissen erlangen, Fragestellungen teilen, gemeinsam Lösungen erarbeiten und Konzepte entwickeln - darum geht es wieder beim inzwischen fünften Gründer*innen-Workshop für genossenschaftliches Bauen und Wohnen am 18. und 19. Juli 2025 in Stuttgart. Die Veranstaltung richtet sich an Gründungsinteressierte besonders im Bereich des gemeinschaftlichen Wohnens und von Stadtteilgenossenschaften, an Menschen aus Architektur, Projektentwicklung, Wohnprojekte-Beratung und kommunaler Verwaltung und weitere am Genossenschaftsthema Interessierte.
