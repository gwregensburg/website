title: Tag der Münchner Dachgärten
date: '2025-07-05'
time: 9 - 20 Uhr
location: München (verschiedene Orte)
organizer: Stadt München
link: https://www.mitbauzentrale-muenchen.de/aktuelles/news/news-detail/tag-der-muenchner-dachgaerten.html
description: 'Die Stadt München lädt dazu ein, am 5. Juli 2025 die grüne Oase der Dachgärten zu entdecken, mit dabei sind sieben gemeinschaftliche Wohnprojekte. Sie laden alle Interessierten dazu ein, die vielfältigen Möglichkeiten der Dachbegrünung zu erleben. Die Dachgärten der Wohnprojekte stehen allen Bewohner:innen zur Verfügung und bieten Platz für kreative Ideen: Ob bei einer geselligen Grillrunde in der Außenküche, dem Anbau von frischem Gemüse oder gemütliche Stunden im Heckenzimmer. Zudem sind sie ein Rückzugsort für eine Vielzahl von Pflanzen und Tieren und fördern somit die Artenvielfalt in München. Hier wird nicht nur gegärtnert, sondern auch gelacht, diskutiert und gemeinsam Zeit verbracht.'
