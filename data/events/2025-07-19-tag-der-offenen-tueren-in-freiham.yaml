title: Tag der offenen Türen in Freiham
date: '2025-07-19'
time: 12 - 18 Uhr
location: München Freiham (verschiedene Orte)
organizer: Stadt München
link: https://www.mitbauzentrale-muenchen.de/aktuelles/news/news-detail/tag-der-offenen-tueren-in-freiham-am-19-07-2025.html
description: Wohnprojekte in Freiham geben Einblicke am „Tag der offenen Türen in Freiham“. An diesem Tag können Sie erleben, was in den letzten Jahren in Freiham entstanden und gewachsen ist und wie es sich dort wohnt und lebt. Sie können mit Bewohnerinnnen und Bewohnern ins Gespräch kommen und sich über die vielfältigen Konzepte und Ideen informieren.
