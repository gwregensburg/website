title: Mietshäuser-Syndikats-Stammtisch
date: '2024-06-19'
time: 19 - 22 Uhr
location: M26 (Maximilianstraße 26)
organizer: Mietshäuser-Syndikat
description: Der Mietshäuser-Syndikats-Stammtisch versteht sich als Regensburger Plattform für das Thema Mietshäuser Syndikate. Jeden dritten Mittwoch im Monat trifft sich das Mietshäuser-Syndikat, um über selbstverwalteten und bezahlbaren Wohnraum in Regensburg zu reden und Hausprojekte umzusetzen. Eingeladen sind alle, die Interesse an selbstverwaltetem Wohnraum haben – egal, ob ihr gerade erst von dieser Idee erfahren habt und einfach neugierig seid oder bereits Mitglied in einem Hausverein seid! Wir, als MHS-Stammtisch verstehen uns dabei als Plattform und Netzwerk für Aktivismus zum Thema Mietshäusersyndikat und selbstverwalteten Wohn- und Kulturraum. Wir wollen über Hausprojekte und Leerstand informieren und aufklären, darüber hinaus wollen wir auch als Ideenfabrik rund ums Thema bezahlbares Wohnen fungieren, um neue Konzepte zu entwickeln! Wir möchten das unerträgliche Missverhältnis zwischen dem knappen und teuren Wohnraum in Regensburg einerseits und hundertfachem Leerstand andererseits anprangern und aktiv werden, damit sich das ändert.
