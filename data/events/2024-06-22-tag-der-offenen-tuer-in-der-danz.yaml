description: Vor zwölf Jahren kauften die damaligen Bewohnerinnen der DANZ das Haus mit legendärer WG-Geschichte und nahmen es zusammen mit dem Mietshäusersyndikat dauerhaft vom Markt. Am kommenden Samstag stellt sich das Projekt wieder einmal der Öffentlichkeit vor.
