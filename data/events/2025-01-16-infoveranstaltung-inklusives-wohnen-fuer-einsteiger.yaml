title: 'Infoveranstaltung: Inklusives Wohnen für Einsteiger'
date: '2025-01-16'
time: 16 - 18:30 Uhr
location: online
organizer: WOHN:SINN - Bündnis für inklusives Wohnen e.V.
link: https://www.wohnsinn.org/unser-angebot/termine/details/infoveranstaltung-inklusives-wohnen-fuer-einsteiger-112
description: 'Die Grundidee einer inklusiven Wohnform ist simpel und doch innovativ: Behinderte Menschen leben selbstbestimmt mit anderen Menschen in einer aktiven Wohn- oder Hausgemeinschaft zusammen. In unserer Infoveranstaltung erklären wir Ihnen, wie das inklusive Miteinander funktionieren kann. Dabei geben wir nicht nur einen exklusiven Einblick in den inklusiven Alltag, sondern auch einen Überblick über die vielfältigen inklusiven Wohnprojekte aus unserem Netzwerk. Zu guter Letzt gewinnen Sie einen Eindruck, wie Sie selbst ein inklusives Wohnprojekt starten können.'
