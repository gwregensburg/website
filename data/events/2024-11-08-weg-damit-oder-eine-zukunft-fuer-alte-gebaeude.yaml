title: „Weg damit – oder eine Zukunft für alte Gebäude!“
date: '2024-11-08'
time: 19 Uhr
location: Degginger
organizer: Architekturkreis
link: https://www.architekturkreis.de/aktuelles/veranstaltung01-c3j35-8tcxj-a8n2f-dt5r3-eshd5
description: <i>Architekturvortrag von Birgit & Mathias Mahnke.</i> <br> Birgit und Mathias Mahnke sind Unternehmensberater und Immobilienentwickler. Ihr Kredo lautet aber nicht abreißen, sondern Umnutzen! Ganz im Sinne der Baukultur entwickeln sie  aus alten Gebäuden moderne und zeitgemäße Architektur mit neuer Nutzung. Ein Schwerpunkt für die neue Nutzung ist die Kreativwirtschaft aber auch Urlaubsarchitektur und Wohnen in alten Gemäuern. Geographischer Schwerpunkt ist der Osten Deutschlands, wo sie in der Fachwelt viel Aufmerksamkeit durch die Umnutzung alter und vom Abriss bedrohter Industriearchitektur erhalten haben.
