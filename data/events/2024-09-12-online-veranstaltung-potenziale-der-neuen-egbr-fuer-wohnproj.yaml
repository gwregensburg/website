title: 'Online-Veranstaltung: Potenziale der neuen eGbR für Wohnprojekte'
date: '2024-09-12'
time: 16 - 17:45 Uhr
location: online
organizer: Stiftung trias
link: https://www.netzwerk-immovielien.de/termine/online-veranstaltung-potenziale-der-neuen-egbr-fuer-wohnprojekte/
description: Die GbR ist eine Rechtsform, die mitunter auch für Wohnprojekte interessant ist. Zum 01.01.2024 wurde die Rechtsgrundlage vom Gesetzgeber angepasst und die eingetragene GbR (eGbR) eingeführt. In unserer kostenlosen Online-Veranstaltung berichtet die Rechtsanwältin Angelika Majchrzak-Rummel, was die geänderte Rechtslage zur GbR/ eGbR für Wohnprojekte bedeutet. Im zweiten Teil der Veranstaltung beantworten die Referentin und erfahrene Berater*innen den Teilnehmenden ihre Fragen.
