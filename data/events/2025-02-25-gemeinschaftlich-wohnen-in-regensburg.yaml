title: Gemeinschaftlich wohnen in Regensburg
subtitle: Beispiele aus der Praxis und Möglichkeiten der Förderung
date: '2025-02-25'
time: 19 -21 Uhr
location: Am Ölberg 2, 93047 Regensburg
organizer: Evangelisches Bildungswerk Regensburg e.V.
link: https://www.ebw-regensburg.de/veranstaltungen/gemeinschaftlich-wohnen-in-regensburg-2/
description: Wie wollen wir in Zukunft in Regensburg wohnen und leben? Gemeinschaftliches Wohnen bedeutet, Menschen leben bewusst zusammen. Ziel ist eine gute Nachbarschaft zu haben, sich umeinander zu kümmern und Vereinsamung zu vermeiden. Das Interesse an gemeinschaftlichen Wohnen wächst. Die Formen des gemeinschaftlichen Wohnens sind sehr unterschiedlich. <br> An diesem Abend wird vorgestellt, wie gemeinschaftliche Wohnformen gefördert und unterstützt werden können. Rahmenbedingungen in Stadt und Land für gemeinschaftliches Wohnen. Jürgen Mistol, wohnungspolitischer Sprecher der Bündnis 90 / Die Grünen - Landtagsfraktion, berichtet über bereits bestehende Fördermöglichkeiten durch den Freistaat und seine Vorstellungen der Förderung. Florian Plajer, Planungs- und Baureferent der Stadt Regensburg, informiert über die städtischen Möglichkeiten und Vorhaben.
