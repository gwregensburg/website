title: '4. BAUKULTURTAGE: Wohnen neu denken!'
date: '2025-10-31'
end_date: '2025-11-13'
location: M26 (Maximilianstraße 26)
organizer: M26 / bauwärts / Architekturkreis Regensburg / A4F / Gemeinschaftlich Wohnen Regensburg e.V.
link: /docs/Klappflyer_Baukulturtage.pdf
description: 'Das Einfamilienhaus (EFH) ist bis heute der Wohntraum der Deutschen. Auch wenn diese Wohnform vor allem auf die Bedürfnisse von Familien mit Kindern ausgerichtet ist und für andere Lebensphasen selten ideal ist. Für immer mehr EFH-Besitzende stellt sich deshalb die Frage: <b>„Was tun, wenn das eigene Haus zu groß oder man darin zu einsam, der Unterhalt zu mühsam und anstehende Sanierungen zu aufwändig und teuer erscheinen?“</b> Wohnalternativen gibt es vor Ort kaum. Menschen in anderen Lebenssituationen als der Kleinfamilie, beispielsweise junge Paare oder Alleinerziehende, finden in EFH-Wohngebieten kaum passende (Miet)Wohnräume. <b>Wie können wir also Häuser weiterentwickeln und Wohnen neu denken?</b> <br><br>Die 4. Regensburger Baukulturtage holen Ausstellungen, Best Practise Projekte und Expert:innen sowie Vorreiter:innen nach Regensburg ins M26 und laden alle in der Region Regensburg ein, aktiv beim Diskurs über das Wohnen der Zukunft mitzuwirken! Alle Veranstaltungen sind kostenfrei.'
