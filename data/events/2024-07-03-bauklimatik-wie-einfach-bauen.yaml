title: Bauklimatik – wie einfach bauen?
date: '2024-07-03'
time: 18:30 - 21 Uhr
location: Degginger
organizer: Architekturkreis
link: https://www.architekturkreis.de/aktuelles/veranstaltung01-c3j35-8tcxj
description: 'Bei diesem Themenabend steht die Frage im Mittelpunkt, wie man Gebäude adäquat ausstatten und gleichzeitig einfach (um)bauen kann. Zunächst werden die beiden renommierten Experten das Thema aus ihrer jeweiligen Perspektive in einem rund 30- bis 40 minütigen Impulsvortrag darstellen: Frau Prof. Elisabeth Endres beleuchtet in Ihrem Impuls das Themenfeld der Bauklimatik unter dem Gesichtspunkt der Nachhaltigkeit, Prof. Florian Nagler referiert unter dem Titel „einfach (um)bauen“. Daran schließt sich eine Podiumsdiskussion an, bei der vertiefende Fragen erörtert werden. Beispielsweise zu neuen Herangehensweisen an Planungs- und Bauabläufe oder zu erforderlichen Veränderungen bei Vorschriften und Prozessen. Das Publikum ist ausdrücklich aufgefordert, sich aktiv einzubringen und mitzudiskutieren!'
