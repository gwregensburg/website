title: Tag der offenen Wohnprojekte 2024
date: '2024-06-22'
time: 10 - 18 Uhr
location: München
organizer: mitbauzentrale München
link: https://www.mitbauzentrale-muenchen.de/aktuelles/termine/termine-detail/tag-der-offenen-wohnprojekte-2024.html
description: 50 Münchner Projekte und Initiativen aus dem Umland – Genossenschaften, Syndikate, Baugemeinschaften und Vereine – öffnen ihre Türen und laden zu Besichtigungen, Diskussionsrunden und anderen Aktivitäten ein. Der Tag bietet Gelegenheit die Projekte hautnah zu erleben, mit Bewohnern ins Gespräch zu kommen und sich über unterschiedliche Wohnkonzepte zu informieren.
