description: 'Das Bauen in der Gemeinschaft wird immer attraktiver. Folglich nimmt die Zahl der Baugruppen und Baugemeinschaften, die sich Wohnraum in eigener Regie erschaffen, stetig zu. Dieses Buch gibt eine Einstiegshilfe: Von der ersten Idee über die Gründung der Baugruppe und die Bauzeit bis hin zum Einzug stellt es den Ablauf anschaulich dar. Gerade die Gründungsphase ist bedeutend, da hier die Weichen für ein erfolgreiches Bauen und zufriedenes Wohnen gestellt werden.'
