description: In den europäischen Städten entstehen zurzeit gemeinschaftliche Wohnprojekte, die eine enorme Kraft und Lebendigkeit entfalten. Noch vor wenigen Jahren sahen Kritiker in den neuen Wohnprojekten nur periphere Inseln für gemeinschaftssehnsüchtige Nostalgiker. Inzwischen finden gemeinschaftliche Wohn- und Lebensprojekte eine breite Anerkennung. Besonders Genossenschaften, aber auch private Baugemeinschaften haben sich als neue Akteure auf einem angespannten Wohnungsmarkt etabliert und werden von Städten und Gemeinden unterstützt. <br>Das Forschungsprojekt der Wüstenrot Stiftung beginnt mit der Analyse von zwölf gemeinschaftlichen Wohnprojekten. Durch eine systematische Gegenüberstellung werden in den Kapiteln Stadt, Raum, Programm und Organisation allgemeingültige Thesen abgeleitet.
