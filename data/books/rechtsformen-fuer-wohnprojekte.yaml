description: Für die Realisierung von Wohnprojekten können grundsätzlich sehr unterschiedliche Rechtsformen in Betracht kommen. Diese Broschüre hilft, sich mit den unterschiedlichen Rechtsformen vertraut zu machen und sich ein Bild von den jeweiligen Chancen und Risiken zu verschaffen.
