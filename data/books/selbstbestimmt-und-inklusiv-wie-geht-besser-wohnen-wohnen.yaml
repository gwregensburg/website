title: 'Selbstbestimmt und inklusiv: Wie geht besser wohnen? Wohnen Inklusiv Regensburg'
type: Video
author: mdr/Youtube
link: https://www.youtube.com/watch?v=9bbNsmb-eOo
description: Tan Caglar besucht auch das “Wohnen Inklusiv Regensburg”-Haus. In diesem Haus leben etwa 75 Menschen mit und ohne Behinderung in eigenen Wohnungen zusammen. Es bietet Rückzug und Gemeinsamkeit – und das in dem Maß, wie es die Bewohner möchten. Das Haus ist als Genossenschaft organisiert und geht auf eine Elterninitiative zurück. Die Gründer wollten für ihre geistig behinderten Kinder eine möglichst vielfältige Wohnumgebung schaffen.
