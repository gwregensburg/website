title: ZUSAMMEN! Wie Deutschland neues Wohnen ausprobiert
image: /images/zusammen.jpg
link: https://www.buechner-verlag.de/buch/zusammen/
description: Zusammen! stellt Menschen vor, die jenseits der Logik von ›Mieten oder Besitzen!‹ leben wollen. Denn die Mieten, vor allem in den Ballungszentren, steigen, und die Frage, ob wir uns den Traum vom trauten Eigenheim in Zeiten des Klimawandels noch leisten können, erhitzt die Gemüter. Gemeinschaftliches Bauen und Wohnen ist ein Abenteuer, eine Lebensaufgabe.
