title: Aus dem Leben - Alter mit Henning Scherf
type: Podcast
link: https://www.sr-mediathek.de/index.php?seite=7&id=9488&pnr=&tbl=pf
description: "Alter und Glück - diese Worte werden nur selten in einem Atemzug genannt. Bei Henning Scherf ist das anders. Der ehemalige Bremer Bürgermeister wirbt schon lange dafür, das Alter positiv zu sehen. Und er wohnt schon lange in einer Art Senioren-WG, die er mit Freunden gegründet hat. Inzwischen ist er selbst 80 Jahre alt und lebt vor, was er in seinen Büchern empfiehlt. Zum Beispiel in \x84Wer nach vorne schaut, bleibt länger jung\x93. Aber auch Jüngere sollten lernen, die \x84Alten\x93 mit anderen Augen zu sehen. Über all das hat Henning Scherf mit Moderator Uwe Jäger in \x84Aus dem Leben\x93 auf SR 3 Saarlandwelle gesprochen"
