description: Menschen sind verschieden, und so auch die Wohnprojekte, in denen sie sich gemeinschaftlich organisieren. Entsprechend unterschiedlich zeigen sich Gestaltung und Nutzungen ihrer Gemeinschaftsräume und folglich gibt es auch keinen allgemeingültigen Lösungsansatz zu deren Konzeption, Planung und Betrieb. Die Autor*innen, Helene Rettenbach und Mathias Sommer, haben für diese Broschüre 48 Wohnprojekte besucht und ihre Erfahrungen zu den Gemeinschaftsräumen festgehalten, um dazu beizutragen, dass Gemeinschaft in Wohnprojekten gelingt.
